name: catalog CI

on:
  push:
    branches: [main]

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
      - name: require catalog tree
        run: |
          set -euo pipefail
          test ! -f VERSION
          test -f catalog
          test -f index
          test -f CNAME
          test -f .nojekyll
          test -f ANCHOR.oo
          test -f registry.pub
          test -f index.minisig
          test -f index.sig
          test -f hello/manifest
          test -f hello/hello.oo
          test -f echo/manifest
          test -f echo/echo.oo
          test -f sqlite/manifest
          test -f sqlite/sqlite.oo
          grep -qx 'catalog.openooda.org' CNAME
          grep -q '^hello|' catalog
          grep -q '^echo|' catalog
          grep -q '^caps|' catalog
          grep -q '^sqlite|' catalog
          cmp -s catalog index
          hello_sha=$(awk -F= '/^sha256=/{print $2; exit}' hello/manifest)
          echo_sha=$(awk -F= '/^sha256=/{print $2; exit}' echo/manifest)
          sqlite_sha=$(awk -F= '/^sha256=/{print $2; exit}' sqlite/manifest)
          grep -q "^hello|.*|${hello_sha}$" catalog
          grep -q "^echo|.*|${echo_sha}$" catalog
          grep -q "^sqlite|.*|${sqlite_sha}$" catalog
          for p in hello echo caps sqlite; do
            ! grep -q "import \"$p.oo\"" "$p/ANCHOR.oo" || { echo "ERR payload import in $p/ANCHOR.oo"; exit 1; }
          done
          for d in . hello echo caps sqlite qa docs; do
            test -f "$d/ANCHOR.oo" || { echo "ERR missing $d/ANCHOR.oo"; exit 1; }
          done
          for f in $(find . hello echo caps sqlite qa docs -name '*.oo' -o -name '*.oot'); do
            n=$(wc -l < "$f"); test "$n" -le 256 || { echo "ERR over 256 lines: $f n=$n"; exit 1; }
          done
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: typecheck proofs twice
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          for t in qa/catalog_proof.oo; do
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
          done

  blackbox-gate:
    needs: [catalog-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
        with:
          path: catalog
      - name: install blackbox (download prebuilt from GitHub release)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox.sha256" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64.sha256"
          (cd "$HOME/.openooda/bin" && sha256sum -c blackbox.sha256)
          chmod +x "$HOME/.openooda/bin/blackbox"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/catalog
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in qa/*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace1" 2>&1 || {
              echo "[blackbox-gate FAIL] trace non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace2" 2>&1 || {
              echo "[blackbox-gate FAIL] second trace non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.trace1" "/tmp/${base}.trace2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic trace on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.trace1" "/tmp/${base}.trace2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run"

  auto-release:
    needs: [catalog-gate, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v1.0.14
