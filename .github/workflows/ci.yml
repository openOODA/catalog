name: catalog CI

on:
  workflow_dispatch:
jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
      - name: require catalog tree
        run: |
          set -euo pipefail
          test ! -f VERSION
          test -f catalog
          test -f index
          test -f CNAME
          test -f .nojekyll
          test -f anchor.oo
          test -f registry.pub
          test -f index.minisig
          test -f index.sig
          grep -qx 'catalog.openooda.org' CNAME
          cmp -s catalog index
          # The catalog index is the single source of truth for the package
          # set: every indexed row must resolve to a shipped package whose
          # payload digest matches the row. Deriving the set from the index
          # keeps the gate honest when packages come and go.
          rows=0
          while IFS='|' read -r name ver caps deps sha; do
            [ -n "$name" ] || continue
            rows=$((rows + 1))
            test -f "$name/manifest" || { echo "ERR missing $name/manifest"; exit 1; }
            test -f "$name/anchor.oo" || { echo "ERR missing $name/anchor.oo"; exit 1; }
            test -f "$name/$name.oo" || { echo "ERR missing $name/$name.oo"; exit 1; }
            pkg_sha=$(awk -F= '/^sha256=/{print $2; exit}' "$name/manifest")
            test "$pkg_sha" = "$sha" || { echo "ERR $name digest drift: manifest=$pkg_sha index=$sha"; exit 1; }
            ! grep -q "import \"$name.oo\"" "$name/anchor.oo" || { echo "ERR payload import in $name/anchor.oo"; exit 1; }
          done < catalog
          test "$rows" -gt 0 || { echo "ERR empty catalog index"; exit 1; }
          echo "[catalog-tree OK] $rows indexed packages resolve with matching digests"
          for d in . qa docs examples; do
            test -f "$d/anchor.oo" || { echo "ERR missing $d/anchor.oo"; exit 1; }
          done
          for f in $(find . -name '*.oo' -o -name '*.oot' | grep -v '^\./\.git/'); do
            n=$(wc -l < "$f"); test "$n" -le 256 || { echo "ERR over 256 lines: $f n=$n"; exit 1; }
          done
      - name: verify minisig (fail closed)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          minisign -V -p registry.pub -m catalog -x index.minisig
      - name: minisig roundtrip with ephemeral key
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp catalog "$work/catalog"
          cd "$work"
          minisign -G -W -p rt.pub -s rt.key
          minisign -S -W -s rt.key -m catalog -x catalog.minisig -c "ci roundtrip"
          minisign -V -p rt.pub -m catalog -x catalog.minisig
          printf 'X' >> catalog
          if minisign -V -p rt.pub -m catalog -x catalog.minisig; then
            echo "ERR tampered catalog verified"; exit 1
          fi
          echo "[minisig-roundtrip OK] ephemeral sign/verify passes, tamper rejected"
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodac
          path: oodac
      - name: checkout oostd
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oostd
          path: oostd
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: typecheck proofs twice
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          for t in qa/catalog_proof.oo qa/str_ascii.oo; do
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
          done
      - name: build and run catalog proof
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          "${OODA_COMPILER}" build qa/catalog_proof.oo -o /tmp/catalog_proof
          test "$(/tmp/catalog_proof)" = "catalog_proof: PASSED"
      - name: run qa suite (double-check drivers)
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          "${OODA_COMPILER}" build qa/suite.oo -o /tmp/catalog_suite
          /tmp/catalog_suite
      - name: independent index.sig HMAC check (python oracle)
        run: |
          set -euo pipefail
          python3 <<'EOF'
          import hmac
          body = open('index','rb').read()
          sig = open('index.sig').read().strip()
          calc = hmac.new(b'ooda-local-pm', body, 'sha256').hexdigest()
          assert hmac.compare_digest(calc, sig), 'index.sig HMAC mismatch'
          print('[hmac-oracle OK] index.sig matches python HMAC-SHA256')
          EOF
      - name: sign_index reproduces index.sig
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp index "$work/index"
          export OODA_FS_READDIR="${{ github.workspace }}:$work"
          export OODA_FS_WRITEDIR="${{ github.workspace }}:$work"
          "${OODA_COMPILER}" build qa/sign_index.oo -o "$work/sign_index"
          (cd "$work" && ./sign_index)
          cmp index.sig "$work/index.sig"
          echo "[sign-index OK] re-sign byte-identical"
      - name: index.html lists catalog packages
        run: |
          set -euo pipefail
          while IFS='|' read -r name _; do
            [ -n "$name" ] || continue
            grep -q "href=\"/$name/manifest\"" index.html || { echo "ERR $name missing from index.html"; exit 1; }
          done < catalog
          echo "[index-html OK] all catalog packages linked"

  determinism-gate:
    needs: [catalog-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
        with:
          path: catalog
      - name: checkout oostd
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oostd
          path: oostd
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: determinism double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/catalog
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/*_proof.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/*_proof.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run (oodac-native gate)"

  auto-release:
    needs: [catalog-gate, determinism-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
