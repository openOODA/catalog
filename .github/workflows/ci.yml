name: catalog CI

on:
  push:
    branches: [master]

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
      - name: require catalog tree
        run: |
          set -euo pipefail
          test ! -f VERSION
          test -f catalog
          test -f index
          test -f CNAME
          test -f .nojekyll
          test -f anchor.oo
          test -f registry.pub
          test -f index.minisig
          test -f index.sig
          test -f hello/manifest
          test -f hello/hello.oo
          test -f echo/manifest
          test -f echo/echo.oo
          test -f caps/manifest
          test -f caps/caps.oo
          test -f sqlite/manifest
          test -f sqlite/sqlite.oo
          grep -qx 'catalog.openooda.org' CNAME
          grep -q '^hello|' catalog
          grep -q '^echo|' catalog
          grep -q '^caps|' catalog
          grep -q '^sqlite|' catalog
          cmp -s catalog index
          hello_sha=$(awk -F= '/^sha256=/{print $2; exit}' hello/manifest)
          echo_sha=$(awk -F= '/^sha256=/{print $2; exit}' echo/manifest)
          caps_sha=$(awk -F= '/^sha256=/{print $2; exit}' caps/manifest)
          sqlite_sha=$(awk -F= '/^sha256=/{print $2; exit}' sqlite/manifest)
          grep -q "^hello|.*|${hello_sha}$" catalog
          grep -q "^echo|.*|${echo_sha}$" catalog
          grep -q "^caps|.*|${caps_sha}$" catalog
          grep -q "^sqlite|.*|${sqlite_sha}$" catalog
          for p in hello echo caps sqlite; do
            ! grep -q "import \"$p.oo\"" "$p/anchor.oo" || { echo "ERR payload import in $p/anchor.oo"; exit 1; }
          done
          for d in . hello echo caps sqlite qa docs; do
            test -f "$d/anchor.oo" || { echo "ERR missing $d/anchor.oo"; exit 1; }
          done
          for f in $(find . hello echo caps sqlite qa docs -name '*.oo' -o -name '*.oot'); do
            n=$(wc -l < "$f"); test "$n" -le 256 || { echo "ERR over 256 lines: $f n=$n"; exit 1; }
          done
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: typecheck proofs twice
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          for t in qa/catalog_proof.oo qa/str_ascii.oo; do
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
            out=$("${OODA_COMPILER}" check "$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout $t: $out"; exit 1;; esac
          done
      - name: build and run catalog proof
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          "${OODA_COMPILER}" build qa/catalog_proof.oo -o /tmp/catalog_proof
          test "$(/tmp/catalog_proof)" = "catalog_proof: PASSED"

  blackbox-gate:
    needs: [catalog-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
        with:
          path: catalog
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: determinism double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/catalog
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/*_proof.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/*_proof.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run (oodac-native gate)"

  auto-release:
    needs: [catalog-gate, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
