name: catalog CI

on:
  workflow_dispatch:

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout catalog
        uses: actions/checkout@v4
      - name: require catalog tree
        run: |
          set -euo pipefail
          test -f index
          test -f index.sig
          test -f registry.pub
          test -f groups.oot
          test -f SHA256SUMS
          test -f .nojekyll
          test -f AGENTS.md
          test -f README.md
          test -d layers
          test ! -f VERSION
          # Canonical 14-entry catalog root: the 8 source-of-truth entries
          # (AGENTS.md README.md Makefile ooda.pkg anchor.oo cli/ core/ tests/)
          # plus the 6 signed registry surfaces (index index.sig registry.pub
          # groups.oot SHA256SUMS layers/). Allowlisted, not just counted.
          actual=$(find . -maxdepth 1 -mindepth 1 ! -name '.*' -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')
          want="AGENTS.md Makefile README.md SHA256SUMS anchor.oo cli core groups.oot index index.sig layers ooda.pkg registry.pub tests"
          test "$actual" = "$(printf '%s\n' $want | sort | tr '\n' ' ' | sed 's/ $//')" || { echo "ERR root entries drift"; echo "have: $actual"; exit 1; }
          # Exactly the 8 canonical layer directories L0..L7.
          test "$(ls -d layers/*/ | wc -l)" -eq 8
          for l in L0-core L1-kernel L2-OS L3-tools L4-DE L5-apps L6-cloud L7-agents; do
            test -d "layers/$l" || { echo "ERR missing layers/$l"; exit 1; }
          done
          # The catalog index is the single source of truth for the package
          # set: every indexed row must resolve to exactly one shipped package
          # dir whose manifest and payload digest match the row. Deriving the
          # set from the index keeps the gate honest when packages come and go.
          rows=0
          while IFS='|' read -r name ver caps deps sha; do
            [ -n "$name" ] || continue
            rows=$((rows + 1))
            hits=$(ls -d layers/*/"$name" 2>/dev/null | wc -l)
            test "$hits" -eq 1 || { echo "ERR $name resolves to $hits layer dirs"; exit 1; }
            d=$(ls -d layers/*/"$name")
            test -f "$d/manifest" || { echo "ERR missing $d/manifest"; exit 1; }
            test -f "$d/$name.oo" || { echo "ERR missing $d/$name.oo"; exit 1; }
            pkg_sha=$(awk -F= '/^sha256=/{print $2; exit}' "$d/manifest")
            test "$pkg_sha" = "$sha" || { echo "ERR $name digest drift: manifest=$pkg_sha index=$sha"; exit 1; }
            mname=$(awk -F= '/^name=/{print $2; exit}' "$d/manifest")
            test "$mname" = "$name" || { echo "ERR $d manifest name=$mname"; exit 1; }
            mver=$(awk -F= '/^version=/{print $2; exit}' "$d/manifest")
            test "$mver" = "$ver" || { echo "ERR $d manifest version drift: $mver != $ver"; exit 1; }
            actual=$(sha256sum "$d/$name.oo" | cut -d' ' -f1)
            test "$actual" = "$sha" || { echo "ERR $name payload sha256 mismatch"; exit 1; }
          done < index
          test "$rows" -gt 0 || { echo "ERR empty catalog index"; exit 1; }
          # No layer package dir may escape the index.
          for d in layers/*/*/; do
            p=$(basename "$d")
            grep -q "^$p|" index || { echo "ERR $p ships a dir but is not indexed"; exit 1; }
          done
          echo "[catalog-tree OK] $rows indexed packages resolve with matching digests"
      - name: groups.oot contract
        run: |
          set -euo pipefail
          for g in core kernel os tools de apps cloud agents workstation all; do
            grep -q "^@$g = " groups.oot || { echo "ERR missing @$g in groups.oot"; exit 1; }
          done
          python3 <<'PYEOF'
          import os, re, sys
          groups = {}
          for line in open('groups.oot'):
              m = re.match(r'@(\w+)\s*=\s*(.*)', line.strip())
              if m:
                  groups[m.group(1)] = m.group(2).split()
          idx = [l.split('|')[0] for l in open('index') if l.strip()]
          layer_map = {p: d for d in os.listdir('layers') for p in os.listdir(f'layers/{d}')}
          g2l = {'core': 'L0-core', 'kernel': 'L1-kernel', 'os': 'L2-OS', 'tools': 'L3-tools',
                 'de': 'L4-DE', 'apps': 'L5-apps', 'cloud': 'L6-cloud', 'agents': 'L7-agents'}
          covered = set()
          for g, pkgs in groups.items():
              if g in ('all', 'games', 'workstation'):
                  continue
              for p in pkgs:
                  covered.add(p)
                  if layer_map.get(p) != g2l[g]:
                      sys.exit(f'ERR @{g} member {p} lives in {layer_map.get(p)}')
          missing = [p for p in idx if p not in covered]
          if missing:
              sys.exit(f'ERR index packages uncovered by groups: {missing}')
          if not all(p in groups['apps'] for p in groups['games']):
              sys.exit('ERR @games must be a subset of @apps')
          if set(groups['workstation']) != {'@core', '@tools', '@de', '@apps'}:
              sys.exit('ERR @workstation must equal @core @tools @de @apps')
          if set(groups['all']) != {f'@{g}' for g in g2l}:
              sys.exit('ERR @all must expand all 8 layer groups')
          print(f'[groups OK] {len(idx)} packages covered across 8 layer groups + workstation/all')
          PYEOF
      - name: index.sig HMAC check (fail closed)
        run: |
          set -euo pipefail
          python3 <<'EOF'
          import hmac
          body = open('index','rb').read()
          sig = open('index.sig').read().strip()
          calc = hmac.new(b'ooda-local-pm', body, 'sha256').hexdigest()
          assert hmac.compare_digest(calc, sig), 'index.sig HMAC mismatch'
          print('[hmac-oracle OK] index.sig matches index body')
          EOF
      - name: page rule + SHA256SUMS shape
        run: |
          set -euo pipefail
          for f in $(find . -name '*.oo' -o -name '*.oot' | grep -v '^\./\.git/'); do
            n=$(wc -l < "$f"); test "$n" -le 256 || { echo "ERR over 256 lines: $f n=$n"; exit 1; }
          done
          awk 'NF && $0 !~ /^[0-9a-f]{64}  .+/ { print "ERR malformed SHA256SUMS line: " $0; exit 1 }' SHA256SUMS
          echo "[shape OK] pages <=256 lines, SHA256SUMS well-formed"
