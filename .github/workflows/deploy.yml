name: Deploy catalog to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: require catalog tree
        run: |
          set -euo pipefail
          test ! -f VERSION
          test -f catalog
          test -f index
          test -f CNAME
          test -f .nojekyll
          test -f registry.pub
          test -f index.minisig
          grep -qx 'catalog.openooda.org' CNAME
          cmp -s catalog index

  deploy:
    needs: catalog-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: "true"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
